# 电商客服 AI 智能体 — 反向代理（统一 80 入口）
# /api 与 /health → 后端 FastAPI；其余 → 前端 Next.js standalone
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream backend {
        server backend:8000;
    }
    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # 后端 API 反代
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ---- SSE 流式必需（三缺一即失效，勿删）----
            # proxy_http_version 1.1：nginx 默认用 HTTP/1.0 连 upstream，而 HTTP/1.0 无 chunked 传输
            proxy_http_version 1.1;
            # 配合 1.1，清掉 keep-alive 头干扰
            proxy_set_header Connection "";
            # proxy_buffering off：关键项。不关的话 nginx 会把整个 SSE 流攒完再一次性下发
            proxy_buffering off;
            proxy_cache off;
            # ---------------------------------------------

            proxy_read_timeout 300s;
        }

        # 健康检查直连后端
        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # 前端（Next.js standalone）
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
