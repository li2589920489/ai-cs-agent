name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # 精简依赖：smoke 测试仅需 import main + 跑 /health 与鉴权用例。
      # 不装 torch / sentence-transformers / chromadb 等重依赖（Triage/RAG 用例在无 key/无模型时自动 skip）。
      # numpy 必须装：main.py 顶层 import rag → rag/numpy_store.py 顶层 import numpy，
      # 缺它会在 `from main import app` 阶段直接 ImportError（pytest collection error）。
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic python-dotenv openai-agents openai-chatkit pytest httpx numpy

      # 语法检查：compileall 只做 py_compile，不 import 模块，不要求 numpy/pyarrow 等重依赖
      - name: Syntax check (compileall)
        run: python -m compileall -q .

      # smoke 测试：/health + 鉴权用例跑通；LLM/RAG 用例因无 API key / 无本地模型自动 skip
      #
      # 为什么失败时要冒泡成 ::error:: annotation：下载 job 日志需要仓库 admin 权限
      # （GET /actions/jobs/{id}/logs 免鉴权返回 403），而 check-runs 的 annotations
      # 对公开仓库免鉴权可读。把关键行转成 annotation 后，无需登录即可定位失败原因。
      - name: Run smoke tests
        run: |
          set +e
          python -m pytest tests/ -v --tb=short 2>&1 | tee /tmp/pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::pytest 退出码 $status（1=用例失败｜2=收集中断或内部错误｜4=用法错误｜5=未收集到用例）"
            grep -aE "^(ERROR|FAILED|E   )|ModuleNotFoundError|ImportError|RuntimeError|AttributeError|TypeError|SystemExit|Traceback" /tmp/pytest.log \
              | head -8 \
              | sed -e 's/%/%25/g' -e 's/\r//g' \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"
